<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e17"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="35%" stop-color="#818cf8"/><stop offset="70%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="borderGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"><animate attributeName="stop-color" dur="8s" repeatCount="indefinite" values="#06b6d4;#8b5cf6;#ec4899;#06b6d4"/></stop><stop offset="50%" stop-color="#6366f1"><animate attributeName="stop-color" dur="8s" repeatCount="indefinite" values="#6366f1;#ec4899;#06b6d4;#6366f1"/></stop><stop offset="100%" stop-color="#ec4899"><animate attributeName="stop-color" dur="8s" repeatCount="indefinite" values="#ec4899;#06b6d4;#8b5cf6;#ec4899"/></stop></linearGradient><radialGradient id="glowLeft" cx="20%" cy="30%" r="50%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".25"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></radialGradient><radialGradient id="glowRight" cx="80%" cy="70%" r="50%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".25"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(3deg)}}@keyframes floatFast{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-18px) rotate(-4deg)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes beamMove{0%{transform:translateX(-1200px)}}.badge-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-size:13px;font-weight:600;fill:#38bdf8;letter-spacing:1.5px;text-transform:uppercase}.main-title,.sub-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-size:52px;font-weight:900;fill:url(#titleGrad);letter-spacing:-.5px}.sub-title{font-size:20px;font-weight:400;fill:#cbd5e1;letter-spacing:.5px}.tag-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-size:13px;font-weight:500;fill:#e2e8f0}.floating-node-1,.floating-node-2{animation:floatSlow 7s ease-in-out infinite;transform-origin:center}.floating-node-2{animation:floatFast 9s ease-in-out infinite 1s}.floating-node-3,.pulsing-orb{animation:floatSlow 8s ease-in-out infinite 2s;transform-origin:center}.pulsing-orb{animation:pulseGlow 5s ease-in-out infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><circle cx="240" cy="100" r="220" fill="url(#glowLeft)" class="pulsing-orb"/><circle cx="960" cy="240" r="240" fill="url(#glowRight)" class="pulsing-orb" style="animation-delay:2.5s"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g class="floating-node-1"><circle cx="120" cy="80" r="5" fill="#38bdf8" opacity=".6"/><circle cx="170" cy="140" r="3" fill="#818cf8" opacity=".5"/><line x1="120" x2="170" y1="80" y2="140" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1" opacity=".3"/><rect width="36" height="36" x="90" y="240" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity=".35" rx="8" transform="rotate(25 108 258)"/></g><g class="floating-node-2"><circle cx="1060" cy="90" r="6" fill="#f472b6" opacity=".5"/><circle cx="1110" cy="150" r="4" fill="#c084fc" opacity=".6"/><line x1="1060" x2="1110" y1="90" y2="150" stroke="#f472b6" stroke-dasharray="3 3" stroke-width="1" opacity=".3"/><polygon fi